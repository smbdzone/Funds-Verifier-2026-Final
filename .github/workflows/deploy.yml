name: Deploy

on:
  push:
    branches: [main, fv-abbas]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Install, lint & build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci also runs the postinstall (patch-package) hook.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: build-and-verify
    # Manual-only for now — switch to the push-triggered condition below
    # once a manual run has been verified clean, to auto-deploy on push:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/fv-abbas'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting Frontend Deployment"

            cd /home/ubuntu/Funds-Verifier-2026-Final

            echo "Getting latest code"
            git fetch origin fv-abbas
            git reset --hard origin/fv-abbas

            echo "Installing dependencies"
            npm install

            echo "Building Next.js application"
            npm run build

            echo "Restarting Frontend PM2"
            pm2 restart fundsverifier-frontend

            pm2 save

            echo "Frontend Deployment Completed Successfully"

name: Deploy

on:
  push:
    branches: [main, fv-abbas]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false, not true: a queued run should wait its turn, not SIGTERM a
  # deploy that's already mid-flight on the EC2 box (suspected cause of
  # a run dying instantly with no script-visible reason on 2026-09-07).
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Install, lint & build (Next.js)
    runs-on: ubuntu-latest
    env:
      # This CI build is a throwaway verification build — the real
      # production build runs later on EC2, using its own real .env.
      # `new Stripe(...)` is called at module scope in several API
      # routes, so `next build`'s page-data collection needs *a*
      # non-empty value here (never actually called) or it crashes.
      STRIPE_SECRET_KEY: sk_test_dummy_build_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci also runs the postinstall (patch-package) hook.
      - name: Install dependencies
        run: npm ci

      # Non-blocking: eslint-config-next 16.1.2's core-web-vitals config
      # surfaced ~405 pre-existing issues (77 errors) once the eslint 8→9 /
      # flat-config fix landed (see eslint.config.mjs). Still runs and
      # reports in the log — flip back to blocking once that backlog is
      # cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: build-and-verify
    # Manual-only for now — switch to the push-triggered condition below
    # once a manual run has been verified clean, to auto-deploy on push:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/fv-abbas'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain OpenSSH via webfactory/ssh-agent, not appleboy/ssh-action.
      # Switched 2026-09-07: appleboy/ssh-action@v1.2.0 (drone-ssh)
      # reliably killed the session a few seconds to ~20s in — regardless
      # of what command was running at the time — matching multiple
      # independent reports of a v1.2.0-specific regression (e.g.
      # appleboy/ssh-action#348). Plain ssh had zero issues in manual
      # testing, including multi-minute sessions.
      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o BatchMode=yes "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' < .github/workflows/scripts/deploy-frontend.sh

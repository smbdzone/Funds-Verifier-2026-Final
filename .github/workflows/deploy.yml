name: Deploy

on:
  push:
    branches: [main, fv-abbas]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Install, lint & build (Next.js)
    runs-on: ubuntu-latest
    env:
      # This CI build is a throwaway verification build — the real
      # production build runs later on EC2, using its own real .env.
      # `new Stripe(...)` is called at module scope in several API
      # routes, so `next build`'s page-data collection needs *a*
      # non-empty value here (never actually called) or it crashes.
      STRIPE_SECRET_KEY: sk_test_dummy_build_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci also runs the postinstall (patch-package) hook.
      - name: Install dependencies
        run: npm ci

      # Non-blocking: eslint-config-next 16.1.2's core-web-vitals config
      # surfaced ~405 pre-existing issues (77 errors) once the eslint 8→9 /
      # flat-config fix landed (see eslint.config.mjs). Still runs and
      # reports in the log — flip back to blocking once that backlog is
      # cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: build-and-verify
    # Manual-only for now — switch to the push-triggered condition below
    # once a manual run has been verified clean, to auto-deploy on push:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/fv-abbas'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting Frontend Deployment"

            cd /home/ubuntu/Funds-Verifier-2026-Final

            echo "Getting latest code"
            git fetch origin fv-abbas
            git reset --hard origin/fv-abbas

            echo "Installing dependencies"
            npm install

            # `next build` is run detached from this SSH exec channel and
            # polled via a marker file, rather than run as a foreground
            # command on the channel directly. Confirmed (2026-09-07) that
            # a foreground `npm run build` here gets killed partway through
            # (SIGTERM, no error trace) even though the server itself has
            # plenty of free memory/CPU and no OOM-killer or sshd timeout
            # is involved — a plain polling loop over the same connection
            # type survives fine, so it's specifically the long-lived
            # foreground build process that's at risk, not the session.
            echo "Building Next.js application (detached)"
            rm -f /tmp/fv-frontend-build.log /tmp/fv-frontend-build.done
            nohup bash -c 'npm run build > /tmp/fv-frontend-build.log 2>&1; echo $? > /tmp/fv-frontend-build.done' >/dev/null 2>&1 &
            disown

            echo "Waiting for build to finish..."
            for i in $(seq 1 120); do
              if [ -f /tmp/fv-frontend-build.done ]; then
                break
              fi
              sleep 5
            done

            if [ ! -f /tmp/fv-frontend-build.done ]; then
              echo "Build timed out after 10 minutes"
              tail -n 80 /tmp/fv-frontend-build.log
              exit 1
            fi

            BUILD_EXIT=$(cat /tmp/fv-frontend-build.done)
            tail -n 40 /tmp/fv-frontend-build.log
            if [ "$BUILD_EXIT" != "0" ]; then
              echo "Build failed with exit code $BUILD_EXIT"
              exit 1
            fi
            echo "Build succeeded"

            echo "Restarting Frontend PM2"
            pm2 restart fundsverifier-frontend

            pm2 save

            echo "Frontend Deployment Completed Successfully"
